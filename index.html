<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Laboratorio XR - Celda de Manufactura | UMNG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <!-- PARTE A - Libreria de A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  </head>
  <body>

    <a-scene renderer="alpha: true">

      <!-- ASSETS: aqui se agrega el modelo CAD (Fase 3 / Parte D) -->
      <a-assets>
        <!--
        <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
        -->
      </a-assets>

      <!-- FASE 1 - Primitivas basicas -->
      <a-box position="-6 1 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="-3 1 -4" radius="1" color="#EF2D5E"></a-sphere>
      <a-cylinder position="-9 1 -4" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>

      <!-- FASE 2 - Celda de manufactura -->
      <a-entity id="celda-manufactura" position="3 0 -6">

        <a-box position="-2 1.5 -2" width="0.1" height="3" depth="0.1" color="#555555"></a-box>
        <a-box position="2 1.5 -2" width="0.1" height="3" depth="0.1" color="#555555"></a-box>
        <a-box position="0 3 -2" width="4.2" height="0.1" depth="0.1" color="#555555"></a-box>

        <a-box position="0 0.4 0" width="4" height="0.2" depth="1" color="#2E2E2E"></a-box>
        <a-cylinder position="-1.9 0.4 0" radius="0.15" height="1" rotation="0 0 90" color="#8C8C8C"></a-cylinder>
        <a-cylinder position="1.9 0.4 0" radius="0.15" height="1" rotation="0 0 90" color="#8C8C8C"></a-cylinder>

        <a-box class="caja" position="-1.8 0.65 0" width="0.4" height="0.4" depth="0.4" color="#D9A441">
          <a-animation attribute="position" from="-1.8 0.65 0" to="1.8 0.65 0" dur="4000" direction="alternate" repeat="indefinite" easing="linear"></a-animation>
        </a-box>
        <a-box class="caja" position="0 0.65 0" width="0.4" height="0.4" depth="0.4" color="#4CC3D9">
          <a-animation attribute="position" from="0 0.65 0" to="1.8 0.65 0" dur="2000" direction="alternate" repeat="indefinite" easing="linear"></a-animation>
        </a-box>

        <a-cylinder position="3 1 0" radius="0.7" height="2" color="#7BC8A4"></a-cylinder>
        <a-cylinder position="3 2.05 0" radius="0.75" height="0.1" color="#5DA98A"></a-cylinder>

        <a-sphere class="sensor" position="-1.9 0.9 0" radius="0.08" color="#FF3B3B" emissive="#FF3B3B" emissive-intensity="0.6"></a-sphere>
        <a-sphere class="sensor" position="1.9 0.9 0" radius="0.08" color="#39FF6A" emissive="#39FF6A" emissive-intensity="0.6"></a-sphere>

        <a-cylinder position="0 0.5 1.3" radius="0.15" height="1" color="#333333"></a-cylinder>
        <a-box position="0 1.1 1.3" width="0.9" height="0.15" depth="0.15" color="#FF9640" rotation="0 0 20">
          <a-animation attribute="rotation" from="0 0 20" to="0 0 -20" dur="1500" direction="alternate" repeat="indefinite" easing="easeInOutSine"></a-animation>
        </a-box>

      </a-entity>

      <!-- FASE 3 - Placeholder modelo CAD real -->
      <!-- <a-entity gltf-model="#modeloIndustrial" position="-3 0 -8" scale="1 1 1"></a-entity> -->

      <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane>
      <a-sky id="cielo" color="#ECECEC"></a-sky>

      <a-entity camera look-controls wasd-controls position="0 1.6 4">
        <a-cursor color="#FFFFFF"></a-cursor>
      </a-entity>

    </a-scene>

    <!-- ==========================================================
         MODOS MANUALES DE RESPALDO
         GitHub Pages no puede forzar a que el navegador muestre los
         botones nativos de WebXR: eso depende del hardware detectado
         (Cardboard generico fue descontinuado por Google, y Safari/iOS
         no implementa WebXR). Este menu permite elegir manualmente
         entre los 4 modos evaluados en la Parte B, funcionando en
         cualquier dispositivo, incluido iPhone.
         ========================================================== -->

    <video id="camara-ar" autoplay playsinline muted
      style="display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;"></video>

    <div id="vista-cardboard" style="display:none;position:fixed;inset:0;z-index:998;background:#000;">
      <canvas id="ojo-izq" style="position:absolute;left:0;top:0;width:50%;height:100%;"></canvas>
      <canvas id="ojo-der" style="position:absolute;right:0;top:0;width:50%;height:100%;"></canvas>
    </div>

    <div style="position:fixed;bottom:16px;right:16px;z-index:999;font-family:sans-serif;">
      <button id="btn-cambiar-modo" style="padding:10px 14px;background:#222;color:#fff;border:none;border-radius:8px;font-size:14px;">⚙️ Cambiar modo</button>
    </div>

    <div id="menu-modos" style="position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.85);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:sans-serif;color:#fff;">
      <h2 style="margin:0 0 10px 0;font-size:20px;text-align:center;">Selecciona el modo de visualización</h2>
      <button class="btn-modo" data-modo="normal" style="width:260px;padding:14px;font-size:16px;background:#4CC3D9;color:#000;border:none;border-radius:10px;">🖥️ Escritorio</button>
      <button class="btn-modo" data-modo="normal" style="width:260px;padding:14px;font-size:16px;background:#7BC8A4;color:#000;border:none;border-radius:10px;">📱 Móvil (normal)</button>
      <button class="btn-modo" data-modo="cardboard" style="width:260px;padding:14px;font-size:16px;background:#FFC65D;color:#000;border:none;border-radius:10px;">🥽 Cardboard (VR)</button>
      <button class="btn-modo" data-modo="ar" style="width:260px;padding:14px;font-size:16px;background:#EF2D5E;color:#fff;border:none;border-radius:10px;">📷 AR (cámara)</button>
    </div>

    <script>
      // -------- REFERENCIAS --------
      const menuModos = document.getElementById('menu-modos');
      const btnCambiarModo = document.getElementById('btn-cambiar-modo');
      const vistaCardboard = document.getElementById('vista-cardboard');
      const ojoIzq = document.getElementById('ojo-izq');
      const ojoDer = document.getElementById('ojo-der');
      const ctxIzq = ojoIzq.getContext('2d');
      const ctxDer = ojoDer.getContext('2d');
      const videoAr = document.getElementById('camara-ar');
      const cielo = document.getElementById('cielo');

      let cardboardActivo = false;
      let arActivo = false;
      let rafId = null;
      let streamAr = null;

      // -------- MODO CARDBOARD (split-screen manual) --------
      function redimensionarOjos() {
        const w = window.innerWidth / 2;
        const h = window.innerHeight;
        [ojoIzq, ojoDer].forEach(c => { c.width = w; c.height = h; });
      }

      function dibujarOjos() {
        const escena = document.querySelector('a-scene');
        const origen = escena && escena.canvas;
        if (origen) {
          ctxIzq.drawImage(origen, 0, 0, ojoIzq.width, ojoIzq.height);
          ctxDer.drawImage(origen, 0, 0, ojoDer.width, ojoDer.height);
        }
        rafId = requestAnimationFrame(dibujarOjos);
      }

      async function activarCardboard() {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
        }
        redimensionarOjos();
        vistaCardboard.style.display = 'block';
        cardboardActivo = true;
        dibujarOjos();
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      }

      function desactivarCardboard() {
        vistaCardboard.style.display = 'none';
        cardboardActivo = false;
        if (rafId) cancelAnimationFrame(rafId);
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      }

      window.addEventListener('resize', redimensionarOjos);

      // -------- MODO AR (camara trasera como fondo) --------
      async function activarAr() {
        try {
          streamAr = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
          });
          videoAr.srcObject = streamAr;
          videoAr.style.display = 'block';
          if (cielo) cielo.setAttribute('visible', 'false');
          arActivo = true;
        } catch (err) {
          alert('No se pudo acceder a la cámara: ' + err.message);
        }
      }

      function desactivarAr() {
        if (streamAr) streamAr.getTracks().forEach(t => t.stop());
        videoAr.style.display = 'none';
        if (cielo) cielo.setAttribute('visible', 'true');
        arActivo = false;
      }

      // -------- MENU DE SELECCION --------
      document.querySelectorAll('.btn-modo').forEach(btn => {
        btn.addEventListener('click', () => {
          const modo = btn.getAttribute('data-modo');
          if (cardboardActivo) desactivarCardboard();
          if (arActivo) desactivarAr();

          if (modo === 'cardboard') activarCardboard();
          if (modo === 'ar') activarAr();
          // 'normal' no requiere accion extra

          menuModos.style.display = 'none';
        });
      });

      btnCambiarModo.addEventListener('click', () => {
        if (cardboardActivo) desactivarCardboard();
        if (arActivo) desactivarAr();
        menuModos.style.display = 'flex';
      });
    </script>

  </body>
</html>
